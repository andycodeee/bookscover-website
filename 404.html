  <style>
    :root {
      --bg: #fde4f0;
      --text: #d66a9c;
      --text-hover: #b84a80;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: radial-gradient(ellipse at center, #fff3f9 0%, var(--bg) 45%, #f0a9cc 100%);
      background-attachment: fixed;
      font-family: "Fredoka", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .logo {
      max-width: min(360px, 70vw);
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    h1 {
      color: var(--text);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 600;
      line-height: 1;
    }

    p {
      color: var(--text);
      font-size: 1.2rem;
    }

    .home {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      border: 2px solid var(--text);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .home:hover,
    .home:focus-visible {
      background: var(--text);
      color: #ffffff;
    }

    footer {
      padding: 2rem 1rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--text-hover);
    }

    .email {
      padding: 0 1rem 2rem;
    }

    .email a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .email a:hover,
    .email a:focus-visible {
      color: var(--text-hover);
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
