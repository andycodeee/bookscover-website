<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    (() => {
      const url = new URL(window.location.href);
      let shouldRedirect = false;

      if (url.hostname.toLowerCase() !== "www.bookscover.store") {
        url.hostname = "www.bookscover.store";
        shouldRedirect = true;
      }

      if (/\/index\.html$/i.test(url.pathname)) {
        url.pathname = url.pathname.replace(/index\.html$/i, "");
        shouldRedirect = true;
      }

      if (shouldRedirect) {
        window.location.replace(url.href);
      }
    })();
  </script>
  <title>Page Not Found | Books Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7dce9;
      --text: #b94f83;
      --text-hover: #933b68;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 38%, rgba(255, 255, 255, 0.96) 0%, rgba(255, 248, 252, 0.92) 24%, transparent 62%),
        radial-gradient(ellipse at 12% 14%, rgba(255, 249, 242, 0.78) 0%, transparent 42%),
        linear-gradient(135deg, #fff0f7 0%, var(--bg) 52%, #edb4d0 100%);
      background-attachment: fixed;
      font-family: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .logo {
      max-width: min(360px, 70vw);
      width: 100%;
      height: auto;
      display: block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    h1 {
      color: var(--text);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      line-height: 1;
    }

    p {
      color: var(--text);
      font-size: 1.2rem;
    }

    .home {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.75rem;
      border: 2px solid var(--text);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .home:hover,
    .home:focus-visible {
      background: var(--text);
      color: #ffffff;
    }

    footer {
      padding: 2rem 1rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      flex-wrap: wrap;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--text-hover);
    }

    .email {
      padding: 0 1rem 2rem;
    }

    .email a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .email a:hover,
    .email a:focus-visible {
      color: var(--text-hover);
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Books Cover logo">
    <h1>404</h1>
    <p>Oops, this page doesn't exist.</p>
    <a class="home" href="/">Back to home</a>
  </main>

  <footer>
    <a href="https://www.roblox.com/communities/15745994/Books-Cover" target="_blank" rel="noopener noreferrer">Our UGC</a>
    <a href="https://www.roblox.com/games/91792913879834/AFK-for-Gyaru-UGC" target="_blank" rel="noopener noreferrer">Play AFK for UGC</a>
    <a href="https://discord.gg/bookscover" target="_blank" rel="noopener noreferrer">Join our Discord</a>
  </footer>

  <div class="email">
    <a href="mailto:contact@bookscover.store">contact@bookscover.store</a>
  </div>
</body>
</html>
