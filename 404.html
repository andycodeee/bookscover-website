<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    (() => {
      const url = new URL(window.location.href);
      let shouldRedirect = false;

      if (url.hostname.toLowerCase() !== "www.bookscover.store") {
        url.hostname = "www.bookscover.store";
        shouldRedirect = true;
      }

      if (/\/index\.html$/i.test(url.pathname)) {
        url.pathname = url.pathname.replace(/index\.html$/i, "");
        shouldRedirect = true;
      }

      if (shouldRedirect) window.location.replace(url.href);
    })();
  </script>
  <title>Page Not Found | Books Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff61b5;
      --pink-dark: #d82c8a;
      --stroke: 3.7px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      color: #fff;
      font-family: "Fredoka", "Segoe UI", sans-serif;
      background: linear-gradient(rgba(255, 38, 155, .32), rgba(255, 38, 155, .32)), url("background.jpg") center / cover fixed;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    a { color: inherit; text-decoration: none; }

    main {
      flex: 1;
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 42px 20px;
      gap: 18px;
    }

    .logo {
      width: min(620px, 90vw);
      height: auto;
      display: block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    h1,
    p,
    .home,
    footer,
    footer a {
      color: #fff;
      font-family: "Fredoka", "Segoe UI", sans-serif;
      -webkit-text-stroke: var(--stroke) var(--pink);
      paint-order: stroke fill;
    }

    h1 {
      font-size: clamp(72px, 12vw, 120px);
      font-weight: 700;
      line-height: 1;
    }

    p {
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 500;
    }

    .home {
      margin-top: 10px;
      padding: 14px 32px;
      background: url("search.png") center / 100% 100% no-repeat;
      font-size: 18px;
      font-weight: 700;
      transition: transform .2s;
    }

    .home:hover,
    .home:focus-visible {
      transform: translateY(-2px);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 24px 7%;
      background: transparent;
      font-size: 16px;
    }

    .footer-links,
    .footer-credit {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
    }

    footer a {
      font-weight: 600;
    }

    footer a:hover,
    footer a:focus-visible {
      text-decoration: underline;
    }

    @media (max-width: 620px) {
      main { min-height: 70vh; }
      footer {
        flex-direction: column;
        text-align: center;
      }
      .footer-links,
      .footer-credit {
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Books Cover logo">
    <h1>404</h1>
    <p>Oops, this page doesn't exist.</p>
    <a class="home" href="/">Back to home</a>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://www.roblox.com/communities/15745994/Books-Cover" target="_blank" rel="noopener noreferrer">Our UGC</a>
      <a href="https://www.roblox.com/games/91792913879834/AFK-for-Gyaru-UGC" target="_blank" rel="noopener noreferrer">Play AFK for UGC</a>
      <a href="https://discord.gg/bookscover" target="_blank" rel="noopener noreferrer">Discord</a>
    </div>
    <div class="footer-credit">
      <span>Made by</span>
      <a href="https://andycodee.com" target="_blank" rel="noopener noreferrer">andycodee.com</a>
    </div>
  </footer>
</body>
</html>
